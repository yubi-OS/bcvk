# yubi-OS-owned release workflow (OMN-105/OMN-106).
# Upstream's release.yml needs bootc-dev's GitHub App + GPG secrets and a
# merged-PR-with-'release'-label trigger; neither exists on this fork, so this
# workflow is the fork's release path. Dispatch it with an existing tag name.
# Builds linux/amd64 + linux/arm64 on per-arch hosted runners (no QEMU
# emulation) and publishes bare binaries + SHA256SUMS to a GitHub Release.
name: yubios-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.18.0-yubios.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build bcvk (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Build release binary
        env:
          CARGO_PROFILE_RELEASE_LTO: 'true'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
        run: cargo build --release --bin bcvk

      - name: Stage artifact
        run: |
          install -m 0755 target/release/bcvk "bcvk-${{ matrix.arch }}"
          sha256sum "bcvk-${{ matrix.arch }}" > "bcvk-${{ matrix.arch }}.sha256"
          cat "bcvk-${{ matrix.arch }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bcvk-${{ matrix.arch }}
          path: |
            bcvk-${{ matrix.arch }}
            bcvk-${{ matrix.arch }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          merge-multiple: true

      - name: Assemble assets
        run: |
          cat bcvk-amd64.sha256 bcvk-arm64.sha256 > SHA256SUMS
          # Compatibility asset: yubiOS CI historically curls the bare 'bcvk'
          # asset name on amd64 runners (ci_test-bootc-lifecycle,
          # ci_test-sysext-portable). Keep it as a copy of the amd64 binary.
          install -m 0755 bcvk-amd64 bcvk
          sha256sum bcvk bcvk-amd64 bcvk-arm64

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          SRC_SHA="$(git rev-parse HEAD)"
          printf '%s\n\n%s\n\n%s\n' \
            "yubios fork release of bcvk, minted from pinned source commit \`${SRC_SHA}\` (the yubi-OS/yubiOS PINNED.md bcvk pin)." \
            "Scheme: upstream base v0.18.0 + yubios patch set (see RELEASING.md). Built unsigned: the org has no fork release signing key yet; gap tracked in OMN-105." \
            "Assets: bcvk-amd64, bcvk-arm64 (bare binaries), bcvk (amd64 compatibility copy), SHA256SUMS." > notes.md
          gh release create "$TAG" \
            --title "bcvk $TAG" \
            --verify-tag \
            --notes-file notes.md \
            bcvk bcvk-amd64 bcvk-arm64 SHA256SUMS
